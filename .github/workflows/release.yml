name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "A Developer ID certificate is required for release publication. Configure signing secrets or publish a locally signed and notarized build." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The certificate secret has no Developer ID Application identity." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          APP_VERSION: ${{ github.ref_name }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          UNIVERSAL_BUILD: '1'
          SLOP_FACTORY_SUPABASE_URL: ${{ vars.SLOP_FACTORY_SUPABASE_URL }}
          SLOP_FACTORY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SLOP_FACTORY_SUPABASE_PUBLISHABLE_KEY }}
          SLOP_FACTORY_DISABLE_HANDLE_REGISTRATION: ${{ vars.SLOP_FACTORY_DISABLE_HANDLE_REGISTRATION }}
        run: ./Scripts/build-app.sh "$RUNNER_TEMP/Slop Factory.app"

      - name: Verify and zip app
        run: |
          app="$RUNNER_TEMP/Slop Factory.app"
          archive="$RUNNER_TEMP/SlopFactory-${GITHUB_REF_NAME}-macOS.zip"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/SlopFactory" -verify_arch arm64 x86_64
          ditto -c -k --keepParent --sequesterRsrc "$app" "$archive"
          unzip -t "$archive"

      - name: Notarize app
        if: env.CODESIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app="$RUNNER_TEMP/Slop Factory.app"
          archive="$RUNNER_TEMP/SlopFactory-${GITHUB_REF_NAME}-macOS.zip"
          xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"
          rm "$archive"
          ditto -c -k --keepParent --sequesterRsrc "$app" "$archive"

      - name: Build DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app="$RUNNER_TEMP/Slop Factory.app"
          dmg="$RUNNER_TEMP/SlopFactory-${GITHUB_REF_NAME}-macOS.dmg"
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging"
          mkdir "$staging"
          ditto "$app" "$staging/Slop Factory.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Slop Factory" -srcfolder "$staging" -ov -format UDZO "$dmg"
          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "No signing identity; the DMG is unsigned."
            exit 0
          fi
          codesign --timestamp --sign "$CODESIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Attach app to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/SlopFactory-${GITHUB_REF_NAME}-macOS.zip"
          dmg="$RUNNER_TEMP/SlopFactory-${GITHUB_REF_NAME}-macOS.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" "$archive" --generate-notes
          fi
